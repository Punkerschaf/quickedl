<!DOCTYPE html>
<html>
  <head>
    <script defer src="./index.js"></script>
  </head>
  <style>
    body {
      color: white;
      padding: 0 12px;
    }
    sp-heading {
      color: var(--uxp-host-text-color-secondary, white);
    }
    #log {
      border: 1px solid #808080;
      border-radius: 4px;
      padding: 8px;
      margin-top: 8px;
      height: 160px;
      overflow-y: scroll;
      font-family: monospace;
      font-size: 11px;
      white-space: pre-wrap;
    }
    footer {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 10px;
    }
  </style>
  <body>
    <sp-heading size="S">QuickEDL – Phase 0 Spike</sp-heading>
    <sp-body id="status">Nicht verbunden.</sp-body>
    <footer>
      <sp-button id="btn-marker" variant="primary">1. Test-Marker erstellen (bei 0s)</sp-button>
      <sp-button id="btn-color" variant="secondary">2. Marker-Farbe setzen (Blue)</sp-button>
      <sp-button id="btn-colors" variant="secondary">3. Verfügbare Marker-Farben loggen</sp-button>
      <sp-button id="btn-sync" variant="primary">4. Von QuickEDL-Server synchronisieren</sp-button>
    </footer>
    <div id="log"></div>
  </body>
</html>
